# One policy for the explicit daemon paths passed by goalflight_daemon_logs.py.
# 16 MiB (~5x the measured 3.2 MB p90), two archives, size-only rotation.
# Apple's uncompressed count=1 retains .0 and .1 (count is the highest suffix).
# B: no injected log headers. N: no signals. Never compress an open writer's inode.
<default> 600 1 16384 * BN
